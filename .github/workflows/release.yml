name: Flutter Release

on:
  push:
    branches:
      - 'release/**'
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/flutter.yml'

  pull_request:
    branches:
      - main
    types:
      - closed

env:
  FLUTTER_VERSION: "3.38.4"
  PUB_CACHE: ${{ github.workspace }}/.pub-cache
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

concurrency:
  group: flutter-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_release_aab:
    name: Build release AAB
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION_FULL=$(grep "^version:" pubspec.yaml | awk '{print $2}')
          VERSION=$(echo "$VERSION_FULL" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VERSION_FULL" | cut -d'+' -f2)
          FILENAME="ziyyer-${VERSION}+${BUILD_NUMBER}.aab"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version_full=$VERSION_FULL" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

      - name: Rename AAB
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/bundle/release/app-release.aab "release-artifacts/${{ steps.version.outputs.filename }}"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.filename }}
          path: release-artifacts/${{ steps.version.outputs.filename }}
          retention-days: 7

  create_tag_and_release:
    name: Create tag and GitHub release
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Extract version from pubspec
        id: version
        shell: bash
        run: |
          VERSION_FULL=$(grep "^version:" pubspec.yaml | awk '{print $2}')
          VERSION=$(echo "$VERSION_FULL" | cut -d'+' -f1)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_full=$VERSION_FULL" >> "$GITHUB_OUTPUT"

      - name: Create tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}" "${{ github.event.pull_request.merge_commit_sha }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version_full }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          generate_release_notes: true