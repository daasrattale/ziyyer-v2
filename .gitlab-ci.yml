#variables:
#  # Set this to the exact Flutter version you use locally (e.g. 3.44.0).
#  # Update this value to make CI match your local SDK.
#  FLUTTER_VERSION: "3.44.0"

image: "ghcr.io/cirruslabs/flutter:3.38.4"

workflow:
  auto_cancel:
    on_new_commit: interruptible

stages:
  - lint
  - test
  - build:android
  - build:ios
  - release

before_script:
  - flutter --version
  - flutter doctor -v || true
  - flutter pub get

# Lint only on feature/feat branches
lint_feature:
  stage: lint
  interruptible: true
  script:
    - flutter analyze
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.*$/'
    - if: '$CI_COMMIT_BRANCH =~ /^feat\/.*$/'
    - when: never

# Run tests on pushes and merge request pipelines for all branches
test:
  stage: test
  interruptible: true
  script:
    - flutter test --coverage
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

# Build debug APK on all branches/pushes and merge requests
build:apk:debug:
  stage: build:android
  interruptible: true
  script:
    - flutter build apk --debug --no-shrink -v
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

# Build release APK only on release branches
build:apk:release:
  stage: build:android
  interruptible: true
  needs:
    - build:apk:debug
  script:
    - flutter build apk --release -v
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*$/'
    - when: never

# When a release branch is merged into main, create a tag and release notes using
# the GitLab Releases API. This job runs on pushes to `main` where the commit
# message contains a merge from a `release/` branch.
changelog:
  stage: release
  interruptible: true
  image: curlimages/curl:latest
  variables:
    GIT_STRATEGY: fetch
  script:
    - echo "Checking commit message for release merge..."
    - >
      if [[ "$CI_COMMIT_BRANCH" == "main" && "$CI_COMMIT_MESSAGE" =~ Merge.*release/ ]]; then
        echo "Detected release merge"
      else
        echo "Not a release merge - skipping"
        exit 0
      fi
    - VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | sed 's/+.*//')
    - 'echo "Creating release for version: $VERSION"'
    - >
      RELEASE_DATA=$(printf '{"name":"Release %s","tag_name":"v%s","description":"Automated release for v%s","ref":"%s"}' \
      "$VERSION" "$VERSION" "$VERSION" "$CI_COMMIT_SHA")
    - >
      curl --request POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --header "Content-Type: application/json"
      --data "$RELEASE_DATA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Publish the release APK to GitLab Releases (upload + attach as release asset)
publish_release_apk:
  stage: release
  interruptible: true
  image: alpine:3.18
  needs:
    - job: build:apk:release
      artifacts: true
  variables:
    APK_PATH: "build/app/outputs/flutter-apk/app-release.apk"
  script: |
    set -euo pipefail
    apk add --no-cache curl jq bash
    if [ ! -f "$APK_PATH" ]; then
      echo "Release APK not found at $APK_PATH"
      exit 1
    fi
    echo "Uploading $APK_PATH to GitLab uploads API..."
    UPLOAD_JSON=$(curl --silent --show-error --request POST --form "file=@${APK_PATH}" --header "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/uploads")
    echo "Upload response: $UPLOAD_JSON"
    UPLOAD_URL=$(echo "$UPLOAD_JSON" | jq -r .url)
    if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
      echo "Upload failed or returned no url"
      exit 1
    fi
    ASSET_URL="${CI_PROJECT_URL}${UPLOAD_URL}"
    echo "Asset available at: $ASSET_URL"
    VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | sed 's/+.*//')
    TAG="v${VERSION}"
    echo "Creating release ${TAG} (or updating if exists)"
    CREATE_JSON=$(printf '{"name":"Release %s","tag_name":"%s","description":"Automated release for %s","ref":"%s","assets":{"links":[{"name":"apk-%s","url":"%s"}]}}' "$VERSION" "$TAG" "$VERSION" "$CI_COMMIT_SHA" "$VERSION" "$ASSET_URL")
    echo "Release payload: $CREATE_JSON"
    # Try to create the release; capture HTTP status and response body
    HTTP_STATUS=$(curl -s -w "%{http_code}" -o create_response.json --request POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases" \
      --header "JOB-TOKEN: $CI_JOB_TOKEN" \
      --header "Content-Type: application/json" \
      --data "$CREATE_JSON" || true)
    if [ "$HTTP_STATUS" = "201" ]; then
      echo "Release created."
      cat create_response.json
      exit 0
    fi
    echo "Create returned status $HTTP_STATUS, attempting to update existing release..."
    UPDATE_JSON=$(printf '{"name":"Release %s","tag_name":"%s","description":"Automated release for %s","assets":{"links":[{"name":"apk-%s","url":"%s"}]}}' "$VERSION" "$TAG" "$VERSION" "$VERSION" "$ASSET_URL")
    curl --request PUT "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$TAG" \
      --header "JOB-TOKEN: $CI_JOB_TOKEN" \
      --header "Content-Type: application/json" \
      --data "$UPDATE_JSON" || true
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*$/'

