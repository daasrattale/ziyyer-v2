name: Release Pipeline

on:
  push:
    branches:
      - release/*

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from branch
        id: version
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}
          VERSION=${BRANCH_NAME#release/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.10.3"
          channel: "stable"
          cache: true

      - name: Verify Flutter version
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Install git-cliff
        run: |
          curl -L https://github.com/orhun/git-cliff/releases/download/v0.13.0/git-cliff-v0.13.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv git-cliff /usr/local/bin/

      - name: Generate changelog
        run: |
          git-cliff --tag ${{ steps.version.outputs.version }} > CHANGELOG_RELEASE.md

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          bodyFile: CHANGELOG_RELEASE.md
          artifacts: build/app/outputs/apk/release/app-release.apk
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-ios-ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    needs: build-and-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.10.3"
          channel: "stable"
          cache: true

      - name: Verify Flutter version
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release

      - name: Create iOS IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r app-release.ipa Payload/
          rm -rf Payload

      - name: Upload iOS IPA to Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.build-and-release.outputs.version }}
          artifacts: app-release.ipa
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
