name: Flutter Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish AAB to GitHub Release'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  FLUTTER_VERSION: "3.38.4"
  PUB_CACHE: ${{ github.workspace }}/.pub-cache
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

concurrency:
  group: flutter-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_release_aab:
    name: Build release AAB
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'release/')
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      version_full: ${{ steps.version.outputs.version_full }}
      filename: ${{ steps.version.outputs.filename }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Extract version info
        id: version
        shell: bash
        run: |
          VERSION_FULL=$(grep "^version:" pubspec.yaml | awk '{print $2}')
          VERSION=$(echo "$VERSION_FULL" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VERSION_FULL" | cut -d'+' -f2)
          FILENAME="ziyyer-${VERSION}+${BUILD_NUMBER}.aab"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version_full=$VERSION_FULL" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

      - name: Rename AAB
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/bundle/release/app-release.aab "release-artifacts/${{ steps.version.outputs.filename }}"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.filename }}
          path: release-artifacts/${{ steps.version.outputs.filename }}
          retention-days: 7

  publish_aab:
    name: Publish AAB to GitHub Release
    runs-on: ubuntu-latest
    needs: build_release_aab
    if: |
      startsWith(github.ref_name, 'release/') &&
      github.event.inputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - name: Download release AAB
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_release_aab.outputs.filename }}
          path: release-artifacts

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build_release_aab.outputs.version }}
          name: Release ${{ needs.build_release_aab.outputs.version_full }}
          body: Automated release for v${{ needs.build_release_aab.outputs.version_full }}
          target_commitish: ${{ github.sha }}
          files: |
            release-artifacts/${{ needs.build_release_aab.outputs.filename }}