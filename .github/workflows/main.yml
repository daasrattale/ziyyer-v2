name: CI/CD

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
      - 'release/**'
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.38.4"

jobs:
  check:
    if: |
      startsWith(github.ref, 'refs/heads/feature/') ||
      startsWith(github.ref, 'refs/heads/feat/') ||
      startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Analyze
        run: flutter analyze
        
      - name: Run tests
        run: flutter test --coverage

  build-debug:
    if: |
      startsWith(github.ref, 'refs/heads/feature/') ||
      startsWith(github.ref, 'refs/heads/feat/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          
      - name: Build Debug AAB
        run: flutter build appbundle --debug
        
      - name: Upload Debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/bundle/debug/app-debug.aab
          retention-days: 7

  build-release:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    outputs:
      version_full: ${{ steps.get_version.outputs.version_full }}
      version: ${{ steps.get_version.outputs.version }}
      build_number: ${{ steps.get_version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          
      - name: Get version from pubspec
        id: get_version
        run: |
          VERSION_FULL=$(grep "^version:" pubspec.yaml | awk '{print $2}')
          VERSION=$(echo $VERSION_FULL | cut -d'+' -f1)
          BUILD_NUMBER=$(echo $VERSION_FULL | cut -d'+' -f2)
          echo "version_full=$VERSION_FULL" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          
      - name: Build Release AAB
        run: flutter build appbundle --release
        
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

  create-release:
    needs: build-release
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' && 
      contains(github.event.head_commit.message, 'Merge') && 
      contains(github.event.head_commit.message, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version from pubspec
        id: get_version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | sed 's/+.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: Automated release for v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: [build-release]
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Release AAB
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/
          
      - name: Rename AAB
        run: |
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/ziyyer-${{ needs.build-release.outputs.version }}+${{ needs.build-release.outputs.build_number }}.aab

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-release.outputs.version }}
          files: |
            build/app/outputs/bundle/release/ziyyer-${{ needs.build-release.outputs.version }}+${{ needs.build-release.outputs.build_number }}.aab
          name: Release ${{ needs.build-release.outputs.version_full }}
          body: Automated release for v${{ needs.build-release.outputs.version_full }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
