name: Flutter Release

on:
  push:
    branches:
      - 'release/**'
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/flutter.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/flutter.yml'

env:
  FLUTTER_VERSION: "3.38.4"
  PUB_CACHE: ${{ github.workspace }}/.pub-cache
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

concurrency:
  group: flutter-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump_build_number:
    name: Bump pubspec build number
    if: |
      startsWith(github.ref_name, 'release/') &&
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      build_number: ${{ steps.bump.outputs.build_number }}
      version_full: ${{ steps.bump.outputs.version_full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump build number in pubspec.yaml
        id: bump
        shell: bash
        run: |
          CURRENT=$(grep "^version:" pubspec.yaml | awk '{print $2}')
          VERSION=$(echo "$CURRENT" | cut -d'+' -f1)
          BUILD=$(echo "$CURRENT" | cut -d'+' -f2)
          NEW_BUILD=$((BUILD + 1))
          NEW_VERSION_FULL="${VERSION}+${NEW_BUILD}"

          sed -i "s/^version: .*/version: ${NEW_VERSION_FULL}/" pubspec.yaml

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$NEW_BUILD" >> "$GITHUB_OUTPUT"
          echo "version_full=$NEW_VERSION_FULL" >> "$GITHUB_OUTPUT"

      - name: Commit and push updated pubspec
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump build number [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

  build_release_aab:
    name: Build AAB on release branch
    needs: bump_build_number
    if: |
      startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_full: ${{ steps.version.outputs.version_full }}
      build_number: ${{ steps.version.outputs.build_number }}
      filename: ${{ steps.version.outputs.filename }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Extract version info
        id: version
        shell: bash
        run: |
          VERSION_FULL=$(grep "^version:" pubspec.yaml | awk '{print $2}')
          VERSION=$(echo "$VERSION_FULL" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VERSION_FULL" | cut -d'+' -f2)
          FILENAME="ziyyer-${VERSION}+${BUILD_NUMBER}.aab"
          TAG_NAME="build-v${VERSION}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version_full=$VERSION_FULL" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare release asset
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/bundle/release/app-release.aab "release-artifacts/${{ steps.version.outputs.filename }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.filename }}
          path: release-artifacts/${{ steps.version.outputs.filename }}
          retention-days: 7

      - name: Create or update prerelease with AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release build ${{ steps.version.outputs.version_full }}
          body: |
            Automated release-branch build for `${{ github.ref_name }}`.
            Contains Android AAB for version `${{ steps.version.outputs.version_full }}`.
          draft: true
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: |
            release-artifacts/${{ steps.version.outputs.filename }}

  create_tag_and_release:
    name: Create final tag and GitHub release
    if: |
      github.ref_name == 'main' &&
      contains(github.event.head_commit.message, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from pubspec
        id: version
        shell: bash
        run: |
          VERSION_FULL=$(grep "^version:" pubspec.yaml | awk '{print $2}')
          VERSION=$(echo "$VERSION_FULL" | cut -d'+' -f1)
          FILENAME="ziyyer-${VERSION_FULL}.aab"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_full=$VERSION_FULL" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

      - name: Create tag if missing
        shell: bash
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag already exists"
            exit 0
          fi
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build final release AAB
        run: flutter build appbundle --release

      - name: Prepare final asset
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/bundle/release/app-release.aab "release-artifacts/${{ steps.version.outputs.filename }}"

      - name: Create GitHub release with notes and AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version_full }}
          generate_release_notes: true
          files: |
            release-artifacts/${{ steps.version.outputs.filename }}