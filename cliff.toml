# git-cliff configuration for Ziyyer
# Reference: https://git-cliff.org/configuration

[changelog]
# Template for the changelog header
header = """
# Changelog

All notable changes to the Ziyyer project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/),
and this project adheres to [Semantic Versioning](https://semver.org/).
"""

# Template for each release entry
body = """
{% if version %}\
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | title }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING**: {% endif %}{{ commit.message | upper_first }}
  {%- if commit.body %} - {{ commit.body | split('\n') | first }}{%- endif %}
{% endfor %}
{% endfor %}\
"""

# Template for the footer
footer = """
<!-- generated by git-cliff -->
"""

# Trim whitespace
trim = true

[git]
# Regex to match conventional commits
conventional_commits = true

# Filter out commits that don't match the conventional format
filter_unconventional = true

# List of commit groups in order (this sets which commits to include and their order)
commit_parsers = [
  # Features
  { message = "^feat", group = "🎉 Features" },
  { message = "^feature", group = "🎉 Features" },

  # Bug fixes
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^bugfix", group = "🐛 Bug Fixes" },

  # Performance improvements
  { message = "^perf", group = "⚡ Performance" },

  # Documentation
  { message = "^doc", group = "📚 Documentation" },
  { message = "^docs", group = "📚 Documentation" },

  # Refactoring
  { message = "^refactor", group = "♻️ Refactoring" },

  # Testing
  { message = "^test", group = "🧪 Testing" },

  # Chores and dependencies
  { message = "^chore\\(deps", group = "📦 Dependencies" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "🔧 Chores" },

  # CI/CD changes
  { message = "^ci", group = "🤖 CI/CD" },

  # Build changes
  { message = "^build", group = "🏗️ Build" },

  # Style changes
  { message = "^style", group = "🎨 Styling" },
]

# Skip commits with these messages
skip_tags = ["v0.0.0"]

# Skip commits by pattern (e.g., release commits)
skip_commit_pattern = "^chore\\(release\\)"
