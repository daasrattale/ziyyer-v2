#variables:
#  # Set this to the exact Flutter version you use locally (e.g. 3.44.0).
#  # Update this value to make CI match your local SDK.
#  FLUTTER_VERSION: "3.44.0"

image: "ghcr.io/cirruslabs/flutter:3.44.0"

workflow:
  auto_cancel:
    on_new_commit: interruptible

stages:
  - info
  - lint
  - test
  - build:android
  - build:ios
  - release

before_script:
  - flutter --version
  - flutter doctor -v || true
  - flutter pub get

# Lint only on feature/feat branches
lint_feature:
  stage: lint
  interruptible: true
  script:
    - flutter analyze
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.*$/'
    - if: '$CI_COMMIT_BRANCH =~ /^feat\/.*$/'
    - when: never

# Run tests on pushes and merge request pipelines for all branches
test:
  stage: test
  interruptible: true
  script:
    - flutter test --coverage
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

# Job to capture environment info (Flutter/Dart versions and flutter doctor)
# Useful for diagnosing SDK mismatches between local and CI.
info:
  stage: info
  interruptible: true
  when: manual
  allow_failure: true
  script:
    - mkdir -p ci-logs
    - echo "=== FLUTTER VERSION ===" > ci-logs/env.txt
    - flutter --version >> ci-logs/env.txt 2>&1 || true
    - echo "\n=== DART VERSION ===" >> ci-logs/env.txt
    - dart --version >> ci-logs/env.txt 2>&1 || true
    - echo "\n=== FLUTTER DOCTOR ===" >> ci-logs/env.txt
    - flutter doctor -v >> ci-logs/env.txt 2>&1 || true
    - cat ci-logs/env.txt
  artifacts:
    when: always
    paths:
      - ci-logs/env.txt
    expire_in: 1 week

# Build debug APK on all branches/pushes and merge requests
build:apk:debug:
  stage: build:android
  interruptible: true
  script:
    - flutter build apk --debug --no-shrink -v
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

# Build release APK only on release branches
build:apk:release:
  stage: build:android
  interruptible: true
  needs:
    - build:apk:debug
  script:
    - flutter build apk --release -v
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*$/'
    - when: never

# When a release branch is merged into main, create a tag and release notes using
# the GitLab Releases API. This job runs on pushes to `main` where the commit
# message contains a merge from a `release/` branch.
changelog:
  stage: release
  interruptible: true
  image: curlimages/curl:latest
  variables:
    GIT_STRATEGY: fetch
  script:
    - echo "Checking commit message for release merge..."
    - >
      if [[ "$CI_COMMIT_BRANCH" == "main" && "$CI_COMMIT_MESSAGE" =~ Merge.*release/ ]]; then
        echo "Detected release merge"
      else
        echo "Not a release merge - skipping"
        exit 0
      fi
    - VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | sed 's/+.*//')
    - 'echo "Creating release for version: $VERSION"'
    - >
      RELEASE_DATA=$(printf '{"name":"Release %s","tag_name":"v%s","description":"Automated release for v%s","ref":"%s"}' \
      "$VERSION" "$VERSION" "$VERSION" "$CI_COMMIT_SHA")
    - >
      curl --request POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --header "Content-Type: application/json"
      --data "$RELEASE_DATA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
